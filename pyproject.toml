[project]
name = "ahdc-explorer"
version = "0.1.0"
description = "AHDC Data Explorer: natural-language exploration of public-health data, built on the Claude Agent SDK (prototype, synthetic data)"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.182",
    "fastapi>=0.163.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlglot>=30.31.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
