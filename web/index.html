<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AHDC Data Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="star">*</span><span class="name">AHDC Data Explorer</span><span class="ver">v0.1</span></div>
  </header>

  <main>
    <section class="conversation" aria-label="Conversation">
      <div class="label"><span class="gt">&gt;</span>Conversation</div>
      <div class="turns" id="turns"></div>
    </section>

    <div class="composer">
      <label for="prompt" class="sr-only">Ask a question</label>
      <div class="prompt-box">
        <span class="gt">&gt;</span>
        <textarea id="prompt" rows="1" placeholder="Ask about global health data…" autocomplete="off" spellcheck="false"></textarea>
      </div>
      <div class="hint">
        <span id="hint-left">↵ send · ⇧↵ newline · / for commands</span>
        <span id="ctx"></span>
      </div>
    </div>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
